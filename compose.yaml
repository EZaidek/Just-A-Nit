services:
  web:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  production:
    profiles: [production]
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  node_modules:
